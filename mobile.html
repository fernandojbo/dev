<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conferência Mobile - FreteOnX</title>

    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.2/dist/quagga.min.js">
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        window.createSupabaseClient = createClient;
        window.dispatchEvent(new Event('supabase-ready'));
    </script>

    <style>
        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background: #0f172a;
            cursor: pointer;
        }

        #scanner-container video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }

        #scanner-container canvas {
            display: none;
        }

        #scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 30%;
            border: 3px solid rgba(251, 191, 36, 0.4);
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.1);
            transition: all 0.3s ease;
        }

        #scan-overlay.active {
            border-color: rgba(52, 211, 153, 0.8);
            box-shadow: 0 0 40px rgba(52, 211, 153, 0.3);
            animation: pulse-scan 0.5s ease-in-out 2;
        }

        #scan-overlay.error {
            border-color: rgba(239, 68, 68, 0.8);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse-scan {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 0.8;
            }
        }

        #scan-message {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            white-space: nowrap;
            pointer-events: none;
        }

        #codigo-lido {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
            pointer-events: none;
            display: none;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #scan-tap {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 10px 24px;
            border-radius: 30px;
            color: #fbbf24;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            animation: pulse-tap 2s ease-in-out infinite;
        }

        @keyframes pulse-tap {
            0%,
            100% {
                opacity: 0.6;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
        }

        #barcode-input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        /* Loading da câmera */
        #camera-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(251, 191, 36, 0.2);
            border-top: 3px solid #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body id="app-bg"
      class="bg-slate-900 text-white min-h-screen flex flex-col transition-colors duration-150">

    <!-- Cabeçalho -->
    <header class="p-3 bg-slate-800 shadow-md text-center flex justify-between items-center">
        <h1 class="text-lg font-bold">📱 Conferência Mobile</h1>
        <div class="flex items-center gap-3">
            <span id="usuario-logado" class="text-amber-400 text-xs">👤 -</span>
            <button id="btn-sair" class="text-red-400 hover:text-red-300 text-xs font-semibold transition-colors">
                Sair
            </button>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="flex-1 flex flex-col items-center justify-center p-3 gap-3 overflow-hidden">

        <!-- Scanner (Câmera) - TOQUE PARA LER -->
        <div id="scanner-container" class="relative">
            <div id="scanner"></div>
            <div id="camera-loading">
                <div class="spinner"></div>
                <span>Iniciando câmera...</span>
            </div>
            <div id="scan-overlay"></div>
            <div id="codigo-lido"></div>
            <div id="scan-tap">👆 Toque para ler</div>
            <div id="scan-message">📷 Aponte para o código</div>
        </div>

        <!-- Status Box (feedback visual) -->
        <div id="status-box"
             class="w-full max-w-md p-4 rounded-2xl bg-slate-800 shadow-2xl border border-slate-700 transition-all duration-150">

            <h2 id="instruction-title" class="text-base font-semibold text-slate-300 mb-1 text-center">
                Aguardando Leitura...
            </h2>

            <p id="instruction-sub" class="text-xs text-slate-400 mb-3 text-center">
                Bipe a etiqueta <strong>NR</strong>
            </p>

            <div class="space-y-2 text-left">
                <div>
                    <label class="text-xs text-slate-400 block">NR Lida:</label>
                    <span id="display-nr" class="text-lg font-mono font-bold text-amber-400">-</span>
                </div>

                <div>
                    <label class="text-xs text-slate-400 block">Volume Lido:</label>
                    <span id="display-volume" class="text-lg font-mono font-bold text-amber-400">-</span>
                </div>

                <div id="cliente-info" class="hidden mt-2 p-2 bg-blue-900/50 border border-blue-500 rounded-lg">
                    <span class="text-xs text-blue-300 block font-bold">📋 CLIENTE:</span>
                    <span id="display-cliente" class="text-sm font-mono text-white">-</span>
                </div>

                <div id="match-info" class="hidden mt-2 p-2 bg-green-900/50 border border-green-500 rounded-lg">
                    <span class="text-xs text-green-300 block font-bold">✅ VOLUME CLIE ENCONTRADO:</span>
                    <span id="display-match" class="text-sm font-mono text-white">-</span>
                </div>

                <div id="error-details" class="hidden mt-3 p-3 bg-red-900/50 border border-red-500 rounded-lg">
                    <span class="text-xs text-red-300 block font-bold">⚠️ ATENÇÃO:</span>
                    <span id="display-info-extra" class="text-sm font-mono text-white">-</span>
                </div>
            </div>
        </div>

        <!-- Botão para reativar a câmera -->
        <button id="btn-reiniciar-camera" class="text-xs text-slate-400 hover:text-slate-300 transition-colors">
            🔄 Reativar Câmera
        </button>

        <input type="text" id="barcode-input" autofocus>

    </main>

    <script>

        // ==========================================================
        // PROTEÇÃO DE ACESSO
        // ==========================================================

        function verificarLogin() {
            const usuarioSalvo = localStorage.getItem('usuario_logado');
            if (!usuarioSalvo) {
                window.location.href = 'index.html';
                return null;
            }
            try {
                const dados = JSON.parse(usuarioSalvo);
                if (!dados.usuario) {
                    window.location.href = 'index.html';
                    return null;
                }
                return dados;
            } catch (e) {
                window.location.href = 'index.html';
                return null;
            }
        }

        const usuarioLogado = verificarLogin();


        // ==========================================================
        // FUNÇÕES AUXILIARES
        // ==========================================================

        function obterConferente() {
            try {
                const dados = localStorage.getItem('usuario_logado');
                if (dados) {
                    const parsed = JSON.parse(dados);
                    return { nome: parsed.nome, usuario: parsed.usuario, role: parsed.role || 'conferente' };
                }
            } catch (e) {}
            return { nome: 'Desconhecido', usuario: 'unknown', role: 'conferente' };
        }

        function logout() {
            localStorage.removeItem('usuario_logado');
            localStorage.removeItem('conferente');
            window.location.href = 'index.html';
        }

        function limparCodigo(codigo) {
            if (!codigo) return '';
            let limpo = String(codigo).replace(/[\r\n\t]/g, '').trim();
            limpo = limpo.replace(/[^a-zA-Z0-9]/g, '');
            return limpo;
        }

        function limparCampos() {
            document.getElementById('display-nr').textContent = '-';
            document.getElementById('display-volume').textContent = '-';
            document.getElementById('codigo-lido').style.display = 'none';
            document.getElementById('codigo-lido').textContent = '';
            document.getElementById('cliente-info').classList.add('hidden');
            document.getElementById('match-info').classList.add('hidden');
            document.getElementById('error-details').classList.add('hidden');
        }


        // ==========================================================
        // FUNÇÃO PARA FALAR (VOZ FEMININA)
        // ==========================================================

        function falar(texto) {
            try {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.volume = 1;
                const vozes = window.speechSynthesis.getVoices();
                const vozFeminina = vozes.find(v =>
                    v.lang.startsWith('pt') &&
                    (v.name.toLowerCase().includes('female') ||
                        v.name.toLowerCase().includes('zira') ||
                        v.name.toLowerCase().includes('maria') ||
                        v.name.toLowerCase().includes('daniela') ||
                        v.name.toLowerCase().includes('samantha'))
                );
                if (vozFeminina) utterance.voice = vozFeminina;
                window.speechSynthesis.speak(utterance);
            } catch (e) {}
        }


        // ==========================================================
        // CONFIGURAÇÃO SUPABASE
        // ==========================================================

        const SUPABASE_URL = 'https://fqrfknyludtvqaaajjoc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fkC9WhreuFmhmbVRCw6Isw_rftuBACx';


        // ==========================================================
        // VARIÁVEIS GLOBAIS
        // ==========================================================

        let supabaseClient = null;
        let etapa = 1;
        let nrAtual = '';
        let processando = false;
        let timeoutFeedback = null;
        let tentativasValidacao = 0;
        let scannerAtivo = false;
        let leituraAtiva = false;


        // ==========================================================
        // ELEMENTOS DA INTERFACE
        // ==========================================================

        const appBg = document.getElementById('app-bg');
        const statusBox = document.getElementById('status-box');
        const instructionTitle = document.getElementById('instruction-title');
        const instructionSub = document.getElementById('instruction-sub');
        const displayNr = document.getElementById('display-nr');
        const displayVolume = document.getElementById('display-volume');
        const connectionStatus = document.getElementById('connection-status');
        const errorDetails = document.getElementById('error-details');
        const displayInfoExtra = document.getElementById('display-info-extra');
        const clienteInfo = document.getElementById('cliente-info');
        const displayCliente = document.getElementById('display-cliente');
        const matchInfo = document.getElementById('match-info');
        const displayMatch = document.getElementById('display-match');
        const codigoLidoEl = document.getElementById('codigo-lido');
        const scanMessage = document.getElementById('scan-message');
        const scanContainer = document.getElementById('scanner-container');
        const scanTap = document.getElementById('scan-tap');
        const scanOverlay = document.getElementById('scan-overlay');
        const cameraLoading = document.getElementById('camera-loading');


        // ==========================================================
        // INICIALIZAÇÃO SUPABASE
        // ==========================================================

        window.addEventListener('supabase-ready', () => inicializarSupabase());

        window.addEventListener('load', () => {
            if (window.createSupabaseClient && !supabaseClient) inicializarSupabase();

            const conferente = obterConferente();
            const usuarioElement = document.getElementById('usuario-logado');
            if (usuarioElement) {
                usuarioElement.textContent = `👤 ${conferente.nome}`;
            }

            const btnSair = document.getElementById('btn-sair');
            if (btnSair) {
                btnSair.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (confirm('Deseja realmente encerrar a sessão?')) {
                        logout();
                    }
                });
            }

            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    console.log('🗣️ Vozes carregadas:', window.speechSynthesis.getVoices().length);
                };
            }

            iniciarScanner();

            document.getElementById('btn-reiniciar-camera').addEventListener('click', () => {
                iniciarScanner();
            });

            // ==========================================================
            // EVENTO DE TOQUE NA TELA - ATIVA A LEITURA
            // ==========================================================

            scanContainer.addEventListener('click', function() {
                if (processando) {
                    console.log('⏳ Processando, aguarde...');
                    return;
                }

                if (!scannerAtivo) {
                    console.log('⚠️ Scanner não está ativo. Reiniciando...');
                    iniciarScanner();
                    return;
                }

                // ATIVA A LEITURA POR 1 SEGUNDO
                leituraAtiva = true;
                scanOverlay.classList.add('active');
                scanTap.textContent = '📸 Lendo...';
                scanTap.style.color = '#22c55e';
                scanMessage.textContent = '🔍 Lendo código...';

                console.log('👆 Leitura ativada!');

                // Desativa a leitura após 1.5 segundos
                setTimeout(() => {
                    leituraAtiva = false;
                    scanOverlay.classList.remove('active');
                    scanTap.textContent = '👆 Toque para ler';
                    scanTap.style.color = '#fbbf24';
                    if (etapa === 1) {
                        scanMessage.textContent = '📷 Aponte para a NR';
                    } else {
                        scanMessage.textContent = '📷 Aponte para o VOLUME';
                    }
                    console.log('⏹️ Leitura desativada');
                }, 1500);
            });
        });

        function inicializarSupabase() {
            try {
                if (!supabaseClient && window.createSupabaseClient) {
                    supabaseClient = window.createSupabaseClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    testarConexao();
                }
            } catch (err) {
                console.error("Erro ao iniciar cliente:", err);
                connectionStatus.textContent = "Erro ao iniciar Supabase";
                connectionStatus.className = "text-red-400";
            }
        }

        async function testarConexao() {
            if (!supabaseClient) return;
            try {
                const { error } = await supabaseClient.from('conferencia').select('id').limit(1);
                if (error) {
                    connectionStatus.textContent = "Conectado (Verifique permissões RLS)";
                    connectionStatus.className = "text-orange-400";
                } else {
                    connectionStatus.textContent = "Conectado ao Supabase";
                    connectionStatus.className = "text-green-400";
                }
            } catch (e) {
                connectionStatus.textContent = "Erro de conexão de rede";
                connectionStatus.className = "text-red-400";
            }
        }


        // ==========================================================
        // INICIAR SCANNER (CÂMERA)
        // ==========================================================

        function iniciarScanner() {
            if (scannerAtivo) {
                Quagga.stop();
                scannerAtivo = false;
            }

            const container = document.getElementById('scanner');
            cameraLoading.style.display = 'block';

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: container,
                    constraints: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "environment"
                    },
                    area: {
                        top: "20%",
                        right: "10%",
                        left: "10%",
                        bottom: "20%"
                    }
                },
                decoder: {
                    readers: [
                        "code_128_reader",
                        "ean_reader",
                        "ean_8_reader",
                        "code_39_reader",
                        "code_39_vin_reader",
                        "codabar_reader",
                        "upc_reader",
                        "upc_e_reader",
                        "i2of5_reader",
                        "code_93_reader"
                    ],
                    multiple: false
                },
                locate: true
            }, function(err) {
                cameraLoading.style.display = 'none';
                if (err) {
                    console.error('❌ Erro ao iniciar scanner:', err);
                    scanMessage.textContent = '❌ Erro na câmera. Toque para tentar novamente.';
                    scanTap.textContent = '⚠️ Erro na câmera';
                    return;
                }
                scannerAtivo = true;
                console.log('✅ Scanner iniciado');
                scanMessage.textContent = '📷 Aponte e toque para ler';
                scanTap.textContent = '👆 Toque para ler';
                Quagga.start();
            });

            // ==========================================================
            // DETECÇÃO DE CÓDIGO - SÓ FUNCIONA SE A LEITURA ESTIVER ATIVA
            // ==========================================================

            Quagga.onDetected(function(result) {
                // ✅ SÓ PROCESSA SE A LEITURA ESTIVER ATIVA
                if (!leituraAtiva) {
                    console.log('⏸️ Leitura inativa, código ignorado');
                    return;
                }

                const code = result.codeResult.code;
                console.log('📸 Código detectado:', code);

                // Desativa a leitura imediatamente para evitar duplicidade
                leituraAtiva = false;
                scanOverlay.classList.remove('active');
                scanTap.textContent = '👆 Toque para ler';
                scanTap.style.color = '#fbbf24';

                processarCodigoLido(code);
            });

            Quagga.onProcessed(function(result) {
                const drawingCtx = Quagga.canvas.ctx.overlay;
                const drawingCanvas = Quagga.canvas.dom.overlay;

                if (result) {
                    if (result.boxes) {
                        drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute('width')), parseInt(drawingCanvas.getAttribute('height')));
                        result.boxes.filter(function(box) {
                            return box !== result.box;
                        }).forEach(function(box) {
                            Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, drawingCtx, { color: "rgba(251, 191, 36, 0.15)", lineWidth: 1 });
                        });
                    }
                    if (result.box) {
                        // Só desenha a caixa se a leitura estiver ativa
                        if (leituraAtiva) {
                            Quagga.ImageDebug.drawPath(result.box, { x: 0, y: 1 }, drawingCtx, { color: "rgba(52, 211, 153, 0.9)", lineWidth: 2 });
                        } else {
                            Quagga.ImageDebug.drawPath(result.box, { x: 0, y: 1 }, drawingCtx, { color: "rgba(251, 191, 36, 0.3)", lineWidth: 1 });
                        }
                    }
                }
            });
        }


        // ==========================================================
        // PROCESSAR CÓDIGO LIDO
        // ==========================================================

        function processarCodigoLido(codigo) {
            if (processando) return;

            const codigoLido = limparCodigo(codigo);
            if (!codigoLido) return;

            codigoLidoEl.textContent = codigoLido;
            codigoLidoEl.style.display = 'block';

            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            console.log('📱 Código processado:', codigoLido);

            processando = true;

            if (etapa === 1) {
                nrAtual = codigoLido;
                displayNr.textContent = nrAtual;
                displayVolume.textContent = '-';
                errorDetails.classList.add('hidden');
                clienteInfo.classList.add('hidden');
                matchInfo.classList.add('hidden');

                etapa = 2;
                instructionTitle.textContent = "Aguardando Volume...";
                instructionSub.innerHTML = "Bipe a etiqueta de <strong>Volume</strong>";
                tocarSom('neutro');
                scanMessage.textContent = '📷 Aponte para o VOLUME';
                scanTap.textContent = '👆 Toque para ler o VOLUME';

                setTimeout(() => {
                    processando = false;
                }, 300);

            } else if (etapa === 2) {
                const volumeLido = codigoLido;
                displayVolume.textContent = volumeLido;
                scanMessage.textContent = '⏳ Validando...';
                scanTap.textContent = '⏳ Validando...';

                validarNoSupabase(nrAtual, volumeLido).finally(() => {
                    setTimeout(() => {
                        processando = false;
                    }, 300);
                });
            } else {
                processando = false;
            }
        }


        // ==========================================================
        // SONS
        // ==========================================================

        function tocarSom(tipo) {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';

                if (tipo === 'sucesso') {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.1);

                    setTimeout(() => {
                        const osc2 = audioCtx.createOscillator();
                        const gain2 = audioCtx.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioCtx.destination);
                        osc2.frequency.setValueAtTime(1100, audioCtx.currentTime);
                        gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                        osc2.start(audioCtx.currentTime);
                        osc2.stop(audioCtx.currentTime + 0.08);
                    }, 80);

                } else if (tipo === 'erro') {
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);

                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.06);
                }

            } catch (e) {}
        }


        // ==========================================================
        // FUNÇÃO PARA SALVAR LOG DA CONFERÊNCIA
        // ==========================================================

        async function salvarLogConferencia(dados) {
            try {
                await supabaseClient
                    .from('conferencia_log')
                    .insert({
                        nr: dados.nr,
                        volume_clie: dados.volume_clie,
                        conferente: dados.conferente,
                        status: dados.status,
                        mensagem: dados.mensagem || null,
                        created_at: new Date().toISOString()
                    });
            } catch (err) {
                console.error('❌ Erro ao salvar log:', err);
            }
        }


        // ==========================================================
        // VALIDAÇÃO NO SUPABASE
        // ==========================================================

        async function validarNoSupabase(nr, volume) {
            if (!supabaseClient) {
                inicializarSupabase();
                if (!supabaseClient) {
                    setFeedbackVisual(false, "ERRO", "Supabase não conectado.");
                    return;
                }
            }

            const nrLida = String(nr).trim();
            const volumeLido = String(volume).trim();
            const conferente = obterConferente();

            try {
                const { data: registro, error } = await supabaseClient
                    .from('conferencia')
                    .select('*')
                    .eq('nr', nrLida)
                    .eq('volume_clie', volumeLido)
                    .maybeSingle();

                if (error) throw error;

                if (!registro) {
                    console.warn('⚠️ Primeira tentativa falhou, tentando novamente...');
                    tentativasValidacao++;
                    await new Promise(resolve => setTimeout(resolve, 300));
                    const { data: registro2, error: error2 } = await supabaseClient
                        .from('conferencia')
                        .select('*')
                        .eq('nr', nrLida)
                        .eq('volume_clie', volumeLido)
                        .maybeSingle();
                    if (error2) throw error2;
                    if (registro2) {
                        console.log('✅ Encontrado na segunda tentativa!');
                        await processarSucesso(registro2, nrLida, volumeLido, conferente);
                        return;
                    }
                }

                if (registro) {
                    await processarSucesso(registro, nrLida, volumeLido, conferente);
                } else {
                    const { data: nrExiste } = await supabaseClient
                        .from('conferencia')
                        .select('nr')
                        .eq('nr', nrLida)
                        .maybeSingle();

                    let mensagemErro = '';
                    if (!nrExiste) {
                        mensagemErro = `NR ${nrLida} não existe na base`;
                        falar("Atenção, esta NR não está na base de dados.");
                        setFeedbackVisual(false, "❌ NR INVÁLIDA", mensagemErro);
                    } else {
                        mensagemErro = `Volume ${volumeLido} não pertence à NR ${nrLida}`;
                        setFeedbackVisual(false, "❌ VOLUME INVÁLIDO", mensagemErro);
                    }

                    await salvarLogConferencia({
                        nr: nrLida,
                        volume_clie: volumeLido,
                        conferente: conferente.nome || 'Desconhecido',
                        status: 'erro',
                        mensagem: mensagemErro
                    });
                }

            } catch (err) {
                console.error("❌ Erro detalhado no Supabase:", err);
                setFeedbackVisual(false, "❌ ERRO", err.message || "Falha ao buscar dados.");
            }
        }


        // ==========================================================
        // FUNÇÃO AUXILIAR PARA PROCESSAR SUCESSO
        // ==========================================================

        async function processarSucesso(registro, nrLida, volumeLido, conferente) {
            await salvarLogConferencia({
                nr: nrLida,
                volume_clie: volumeLido,
                conferente: conferente.nome || 'Desconhecido',
                status: 'sucesso',
                mensagem: null
            });

            if (registro.cliente || registro.remetente) {
                clienteInfo.classList.remove('hidden');
                displayCliente.textContent = registro.cliente || registro.remetente || 'N/A';
            } else {
                clienteInfo.classList.add('hidden');
            }

            matchInfo.classList.remove('hidden');
            displayMatch.textContent = volumeLido + ' ✅';

            const msgExtra = tentativasValidacao > 0 ? ` (${tentativasValidacao}ª tentativa)` : '';
            setFeedbackVisual(true, `✅ CONFERIDO${msgExtra}`, null);
        }


        // ==========================================================
        // FEEDBACK VISUAL (COM LIMPEZA DOS CAMPOS)
        // ==========================================================

        function setFeedbackVisual(sucesso, mensagem, detalheExtra) {
            if (timeoutFeedback) {
                clearTimeout(timeoutFeedback);
                timeoutFeedback = null;
            }

            instructionTitle.textContent = mensagem;
            codigoLidoEl.style.display = 'none';

            if (sucesso) {
                appBg.className = "bg-green-600 text-white min-h-screen flex flex-col transition-colors duration-100";
                statusBox.className = "w-full max-w-md p-4 rounded-2xl bg-green-700 shadow-2xl border border-green-500 transition-all duration-100";
                errorDetails.classList.add('hidden');
                tocarSom('sucesso');
                scanMessage.textContent = '✅ Conferido!';
                scanTap.textContent = '✅ Conferido!';
                scanOverlay.classList.remove('active');
                scanOverlay.classList.add('active');
                setTimeout(() => scanOverlay.classList.remove('active'), 500);
            } else {
                appBg.className = "bg-red-600 text-white min-h-screen flex flex-col transition-colors duration-100";
                statusBox.className = "w-full max-w-md p-4 rounded-2xl bg-red-700 shadow-2xl border border-red-500 transition-all duration-100";
                if (detalheExtra) {
                    displayInfoExtra.textContent = detalheExtra;
                    errorDetails.classList.remove('hidden');
                } else {
                    errorDetails.classList.add('hidden');
                }
                tocarSom('erro');
                scanMessage.textContent = '❌ Erro! Tente novamente';
                scanTap.textContent = '❌ Tente novamente';
                scanOverlay.classList.remove('active');
                scanOverlay.classList.add('error');
                setTimeout(() => scanOverlay.classList.remove('error'), 800);
            }

            const tempoEspera = sucesso ? 400 : 600;

            timeoutFeedback = setTimeout(() => {
                // ✅ LIMPA OS CAMPOS DA TELA
                limparCampos();

                appBg.className = "bg-slate-900 text-white min-h-screen flex flex-col transition-colors duration-100";
                statusBox.className = "w-full max-w-md p-4 rounded-2xl bg-slate-800 shadow-2xl border border-slate-700 transition-all duration-100";

                // ✅ RESETA A ETAPA PARA 1 (AGUARDANDO NR)
                etapa = 1;
                nrAtual = '';

                instructionTitle.textContent = "Aguardando Leitura...";
                instructionSub.innerHTML = "Bipe a etiqueta <strong>NR</strong>";
                errorDetails.classList.add('hidden');
                clienteInfo.classList.add('hidden');
                matchInfo.classList.add('hidden');
                timeoutFeedback = null;

                scanMessage.textContent = '📷 Aponte e toque para ler';
                scanTap.textContent = '👆 Toque para ler';
                scanTap.style.color = '#fbbf24';
                scanOverlay.classList.remove('active');
                scanOverlay.classList.remove('error');

                if (!scannerAtivo) {
                    iniciarScanner();
                }
            }, tempoEspera);
        }

        console.log('📱 Versão Mobile do Sistema de Conferência carregada');
        console.log('📷 Aponte e TOQUE na tela para ler o código');
        console.log('🛡️ Leitura desativada por padrão, ativada apenas no toque');
    </script>
