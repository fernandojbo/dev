<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Importação de Conferência - FreteOnX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        window.supabaseClient = createClient('https://fqrfknyludtvqaaajjoc.supabase.co', 'sb_publishable_fkC9WhreuFmhmbVRCw6Isw_rftuBACx');
    </script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-white">📥 Importar Dados</h2>
        <p class="text-slate-400 text-sm mb-6">
            Selecione o arquivo e faça o mapeamento das colunas.
        </p>

        <!-- Upload do arquivo -->
        <div class="border-2 border-dashed border-slate-600 rounded-xl p-6 text-center hover:border-amber-500 transition-colors">
            <input type="file" id="fileInput" accept=".csv,.xls,.xlsx" class="hidden">
            <label for="fileInput" class="cursor-pointer block">
                <span class="text-4xl block mb-2">📂</span>
                <span class="block text-amber-400 font-bold mb-2">Clique para selecionar CSV ou XLSX</span>
                <span id="fileName" class="text-xs text-slate-500">Nenhum arquivo escolhido</span>
            </label>
        </div>

        <!-- Área de Mapeamento -->
        <div id="mapeamento-area" class="hidden mt-6">
            <h3 class="text-md font-semibold text-white mb-3">🔀 Mapeamento de Colunas</h3>
            <p class="text-xs text-slate-400 mb-3">Selecione qual coluna do arquivo corresponde a cada campo do sistema:</p>

            <div class="grid grid-cols-3 gap-3 mb-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">📋 NR (Etiqueta)</label>
                    <select id="map-nr" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">📄 NF (Nota Fiscal)</label>
                    <select id="map-nf" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">📦 VOLUME_CLIE</label>
                    <select id="map-volume" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500">
                        <option value="">Selecione...</option>
                    </select>
                </div>
            </div>

            <!-- Preview dos dados -->
            <div id="preview-area" class="hidden mt-4">
                <h4 class="text-sm font-semibold text-slate-300 mb-2">👁️ Preview dos dados (primeiras 5 linhas)</h4>
                <div class="overflow-x-auto max-h-48 overflow-y-auto bg-slate-900/50 rounded-lg p-2">
                    <table class="w-full text-xs" id="preview-table">
                        <thead class="text-slate-400 border-b border-slate-700">
                            <tr id="preview-header"></tr>
                        </thead>
                        <tbody id="preview-body"></tbody>
                    </table>
                </div>
            </div>

            <button id="btnImportar" class="w-full mt-4 py-3 bg-amber-600 hover:bg-amber-700 font-bold rounded-xl transition-all disabled:opacity-50">
                🚀 Importar Dados
            </button>
        </div>

        <div id="status" class="mt-4 text-center text-sm font-semibold"></div>
    </div>

    <script>
        // ==========================================================
        // VARIÁVEIS
        // ==========================================================

        let dadosBrutos = [];
        let colunasArquivo = [];
        let dadosParsed = [];

        // ==========================================================
        // MAPEAMENTO DE SINÔNIMOS (DE/PARA INTELIGENTE)
        // ==========================================================

        const sinonimos = {
            nr: ['nr', 'nro', 'numero', 'num', 'nota_remessa', 'remessa', 'etiqueta', 'codigo_nr', 'n°'],
            nf: ['nf', 'nota_fiscal', 'notafiscal', 'nota', 'nf_e', 'nf-e', 'nfe', 'documento'],
            volume_clie: ['volume_clie', 'volumeclie', 'volume', 'vol_clie', 'vol', 'cliente_volume', 'codigo_volume', 'vol_cliente', 'shipment']
        };

        function detectarColuna(nomeColuna) {
            const nomeLower = nomeColuna.toLowerCase().trim();
            
            for (const [campo, sinList] of Object.entries(sinonimos)) {
                for (const sin of sinList) {
                    if (nomeLower === sin || nomeLower.includes(sin) || sin.includes(nomeLower)) {
                        return campo;
                    }
                }
            }
            return null;
        }


        // ==========================================================
        // LEITURA DO ARQUIVO
        // ==========================================================

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            document.getElementById('fileName').textContent = file?.name || 'Nenhum arquivo';
            
            if (!file) return;

            const isExcel = file.name.endsWith('.xls') || file.name.endsWith('.xlsx');
            const status = document.getElementById('status');
            status.textContent = "⏳ Lendo arquivo...";
            status.className = "mt-4 text-center text-sm font-semibold text-slate-400";

            if (isExcel) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        
                        dadosBrutos = jsonData;
                        processarArquivo(jsonData);
                    } catch (err) {
                        console.error('❌ Erro:', err);
                        status.textContent = "❌ Erro ao ler arquivo: " + err.message;
                        status.className = "mt-4 text-center text-red-400 font-semibold";
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        dadosBrutos = results.data;
                        processarArquivo(results.data);
                    }
                });
            }
        });


        // ==========================================================
        // PROCESSAR ARQUIVO E MOSTRAR MAPEAMENTO
        // ==========================================================

        function processarArquivo(data) {
            if (!data || data.length === 0) {
                document.getElementById('status').textContent = "❌ Arquivo vazio ou inválido!";
                document.getElementById('status').className = "mt-4 text-center text-red-400 font-semibold";
                return;
            }

            // Extrai colunas
            colunasArquivo = Object.keys(data[0]);
            
            // Detecta mapeamento automático
            const map = {
                nr: null,
                nf: null,
                volume_clie: null
            };

            for (const col of colunasArquivo) {
                const detected = detectarColuna(col);
                if (detected && !map[detected]) {
                    map[detected] = col;
                }
            }

            // Preenche os selects
            const selectNR = document.getElementById('map-nr');
            const selectNF = document.getElementById('map-nf');
            const selectVOL = document.getElementById('map-volume');

            [selectNR, selectNF, selectVOL].forEach(sel => {
                sel.innerHTML = '<option value="">Selecione...</option>';
                colunasArquivo.forEach(col => {
                    const opt = document.createElement('option');
                    opt.value = col;
                    opt.textContent = col;
                    sel.appendChild(opt);
                });
            });

            // Seleciona valores detectados
            if (map.nr) selectNR.value = map.nr;
            if (map.nf) selectNF.value = map.nf;
            if (map.volume_clie) selectVOL.value = map.volume_clie;

            // Mostra área de mapeamento
            document.getElementById('mapeamento-area').classList.remove('hidden');
            
            // Atualiza preview
            atualizarPreview(data);

            document.getElementById('status').textContent = `📊 ${data.length} registros encontrados. Configure o mapeamento abaixo.`;
            document.getElementById('status').className = "mt-4 text-center text-sm font-semibold text-emerald-400";
        }


        // ==========================================================
        // ATUALIZAR PREVIEW
        // ==========================================================

        function atualizarPreview(data) {
            const previewArea = document.getElementById('preview-area');
            const header = document.getElementById('preview-header');
            const body = document.getElementById('preview-body');

            if (!data || data.length === 0) {
                previewArea.classList.add('hidden');
                return;
            }

            previewArea.classList.remove('hidden');

            // Cabeçalho
            const cols = Object.keys(data[0]);
            header.innerHTML = cols.map(c => `<th class="px-2 py-1 text-left text-slate-400">${c}</th>`).join('');

            // Corpo (primeiras 5 linhas)
            const rows = data.slice(0, 5);
            body.innerHTML = rows.map(row => {
                return `<tr class="border-b border-slate-700/50">${cols.map(c => `<td class="px-2 py-1 text-slate-300 font-mono text-[10px]">${row[c] || '-'}</td>`).join('')}</tr>`;
            }).join('');

            // Atualiza preview quando mudar selects
            document.getElementById('map-nr').onchange = () => atualizarDadosPreview();
            document.getElementById('map-nf').onchange = () => atualizarDadosPreview();
            document.getElementById('map-volume').onchange = () => atualizarDadosPreview();
        }


        // ==========================================================
        // ATUALIZAR DADOS PREVIEW (com colunas selecionadas)
        // ==========================================================

        function atualizarDadosPreview() {
            const colNR = document.getElementById('map-nr').value;
            const colNF = document.getElementById('map-nf').value;
            const colVOL = document.getElementById('map-volume').value;

            if (!colNR || !colVOL) {
                document.getElementById('status').textContent = "⚠️ Selecione as colunas NR e VOLUME_CLIE para continuar.";
                document.getElementById('status').className = "mt-4 text-center text-sm font-semibold text-yellow-400";
                return;
            }

            const limpaStr = (val) => String(val || '').replace(/[^0-9A-Za-z]/g, '').trim();

            dadosParsed = dadosBrutos.map(row => ({
                nr: limpaStr(row[colNR] || ''),
                nf: colNF ? limpaStr(row[colNF] || '') : '',
                volume_clie: limpaStr(row[colVOL] || '')
            })).filter(row => row.volume_clie !== '' && row.nr !== '');

            // Atualiza preview com colunas mapeadas
            const header = document.getElementById('preview-header');
            const body = document.getElementById('preview-body');
            
            const colsMap = ['nr', 'nf', 'volume_clie'];
            const labels = ['NR', 'NF', 'VOLUME_CLIE'];
            
            header.innerHTML = labels.map(l => `<th class="px-2 py-1 text-left text-amber-400">${l}</th>`).join('');

            const rows = dadosParsed.slice(0, 5);
            body.innerHTML = rows.map(row => {
                return `<tr class="border-b border-slate-700/50">${colsMap.map(c => `<td class="px-2 py-1 text-slate-300 font-mono text-[10px]">${row[c] || '-'}</td>`).join('')}</tr>`;
            }).join('');

            document.getElementById('status').textContent = `📊 ${dadosParsed.length} registros validados para importação.`;
            document.getElementById('status').className = "mt-4 text-center text-sm font-semibold text-emerald-400";
        }


        // ==========================================================
        // FUNÇÃO PARA IMPORTAR PARA O SUPABASE
        // ==========================================================

        document.getElementById('btnImportar').addEventListener('click', async function() {
            const colNR = document.getElementById('map-nr').value;
            const colVOL = document.getElementById('map-volume').value;

            if (!colNR || !colVOL) {
                alert('⚠️ Selecione as colunas NR e VOLUME_CLIE antes de importar!');
                return;
            }

            if (dadosParsed.length === 0) {
                alert('⚠️ Nenhum dado válido para importar!');
                return;
            }

            const btn = document.getElementById('btnImportar');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.textContent = "⏳ Importando...";
            status.className = "mt-4 text-center text-sm font-semibold text-slate-400";

            try {
                const { data: resultado, error } = await window.supabaseClient
                    .from('conferencia')
                    .insert(dadosParsed);

                if (error) throw error;

                status.textContent = `✅ Importação concluída! ${dadosParsed.length} registros importados.`;
                status.className = "mt-4 text-center text-green-400 font-semibold";
            } catch (err) {
                console.error('❌ Erro ao importar:', err);
                status.textContent = "❌ Erro ao importar: " + err.message;
                status.className = "mt-4 text-center text-red-400 font-semibold";
            } finally {
                btn.disabled = false;
            }
        });

        console.log('📥 Importador com mapeamento inteligente carregado');
        console.log('🔀 Sinônimos reconhecidos:', sinonimos);
    </script>

</body>
</html>
